<svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="17" cy="17" r="13" stroke="rgba(0,0,0,0.5)" class="track" />

<circle cx="17" cy="17" r="13" stroke="white" class="spinner">
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="rotate"
    from="0 17 17"
    to="360 17 17"
    dur="0.7s"
    repeatCount="indefinite"
  />
</circle>

<style>
.track {
  stroke-width: 4px;
  stroke-linecap: round;
}

.spinner {
  stroke-width: 3px;
  stroke-linecap: round;
}

.spinner {
  stroke-dasharray: 40px 120px;
  animation: changeStrokeWidth 1s alternate-reverse infinite ease-in-out;
}

@keyframes changeStrokeWidth {
  to {
    stroke-dasharray: 10px 120px;
  }
}
</style>
</svg>
