<defs>
<linearGradient id="paint0_linear_55_8323" x1="225.268" y1="243.086" x2="169.222" y2="345.739" gradientUnits="userSpaceOnUse">
<stop stop-color="#FC7239"/>
<stop offset="1" stop-color="#FF4107"/>
</linearGradient>
<style type="text/css">
.head,
.hair1,
.hair2,
.hair3,
.arm,
.hand,
.ruler {
  animation: 3.5s infinite alternate ease-in-out;
}
.arm {
  transform-origin: 267px 236px;
  animation-name: wobbleArm;
}
.hand {
  transform-origin: 354px 138px;
  animation-name: wobbleHand;
}
.ruler {
  transform-origin: 85px 111px;
  animation-name: wobbleRuler;
}
.head {
  animation-name: headShake;
}
.hair1 {
  animation-name: hair1bounce;
}
.hair2 {
  animation-name: hair2bounce;
}
.hair3 {
  animation-name: hair3bounce;
}
@keyframes headShake {
  0% {transform: translateX(25px)}
  20% {transform: translateX(25px)}
  30% {transform: none}
}
@keyframes hair1bounce {
  0% {transform: translateX(-5px)}
  20% {transform: translateX(-5px)}
  30% {transform: none}
}
@keyframes hair2bounce {
  0% {transform: translateX(-60px)}
  20% {transform: translateX(-60px)}
  30% {transform: none}
}
@keyframes hair3bounce {
  0% {transform: translateX(-35px)}
  20% {transform: translateX(-35px)}
  30% {transform: none}
}
@keyframes wobbleRuler {
  from {transform: rotate(-1deg) translateY(-1px)}
  to {transform: rotate(0.5deg) translateY(-0.5px)}
}
@keyframes wobbleArm {
  from {transform: rotate(-4deg)}
}
@keyframes wobbleHand {
  from {transform: rotate(6deg)}
  to {transform: rotate(-1deg)}
}
</style>
</defs>
</svg>
