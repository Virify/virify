name: Sync Preview Branch with Main

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync preview branch with main
        run: |
          git fetch origin
          git checkout preview || git checkout -b preview
          git reset --hard origin/main
          git push origin preview --force

      - name: Notify sync complete
        run: |
          echo "Preview branch synced with main successfully"
          echo "Railway will now automatically deploy the preview environment"
