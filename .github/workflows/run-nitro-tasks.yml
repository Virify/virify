name: Run Nitro Tasks

on:
  pull_request:
    types: [closed]
    branches: [main, staging]

env:
  NODE_VERSION: '22'

jobs:
  run-tasks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ github.event.pull_request.base.ref == 'main' && secrets.MAIN_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
      PPD_DATABASE_URL: ${{ secrets.PPD_DATABASE_URL }}
      WAITING_LIST_DATABASE_URL: ${{ secrets.WAITING_LIST_DATABASE_URL }}
      NUXT_AUTH_SECRET: ${{ secrets.NUXT_AUTH_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tasks
        id: tasks
        run: |
          # Get all commit messages (subject + body) in this PR
          COMMITS=$(git log --format="%B" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          echo "Scanning commits for task: prefix..."
          
          TASKS=""
          PATTERN='^task(\([^)]+\))?:[[:space:]]*(.+)$'
          
          while IFS= read -r line; do
            if [[ "$line" =~ $PATTERN ]]; then
              TASK_LIST="${BASH_REMATCH[2]}"
              IFS=',' read -ra items <<< "$TASK_LIST"
              for item in "${items[@]}"; do
                TASKS="$TASKS $(echo "$item" | xargs)"
              done
            fi
          done <<< "$COMMITS"
          
          # Dedupe while preserving order
          TASKS=$(echo "$TASKS" | xargs | tr ' ' '\n' | awk '!seen[$0]++' | tr '\n' ' ' | xargs)
          
          echo "tasks=$TASKS" >> $GITHUB_OUTPUT
          echo "has_tasks=$([[ -n "$TASKS" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "📋 Tasks found: ${TASKS:-none}"

      - name: No tasks to run
        if: steps.tasks.outputs.has_tasks == 'false'
        run: |
          echo "## ℹ️ No Tasks" >> $GITHUB_STEP_SUMMARY
          echo "No \`task:\` prefix found in last commit before merge." >> $GITHUB_STEP_SUMMARY

      - uses: pnpm/action-setup@v4
        if: steps.tasks.outputs.has_tasks == 'true'

      - uses: actions/setup-node@v4
        if: steps.tasks.outputs.has_tasks == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.tasks.outputs.has_tasks == 'true'
        run: pnpm install

      - name: Generate Prisma clients
        if: steps.tasks.outputs.has_tasks == 'true'
        run: |
          pnpm pgen
          pnpm pgen:ppd
          pnpm pgen:waiting-list

      - name: Start dev server & run tasks
        if: steps.tasks.outputs.has_tasks == 'true'
        run: |
          # Start dev server in background
          pnpm dev &
          SERVER_PID=$!
          
          # Wait for dev server to be ready
          echo "⏳ Waiting for dev server..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Dev server ready"
              break
            fi
            sleep 2
          done
          
          # Task aliases
          declare -A ALIASES=(
            ["seed"]="db:seed"
            ["migrate"]="db:migrate"
            ["reset"]="db:reset"
            ["fetch-rates"]="mortgage:fetch-rates"
          )
          
          # Run tasks via Nitro's HTTP API
          for task in ${{ steps.tasks.outputs.tasks }}; do
            TASK_NAME="${ALIASES[$task]:-$task}"
            echo "🚀 Running: $TASK_NAME"
            
            RESPONSE=$(curl -s -X GET "http://localhost:3000/_nitro/tasks/$TASK_NAME")
            echo "$RESPONSE"
            
            # Check if task failed
            if echo "$RESPONSE" | grep -q '"error"'; then
              echo "❌ Task $TASK_NAME failed"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            
            echo "✅ Done: $TASK_NAME"
          done
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

      - name: Summary
        if: steps.tasks.outputs.has_tasks == 'true'
        run: |
          ENV="${{ github.event.pull_request.base.ref == 'main' && 'production' || 'staging' }}"
          echo "## ✅ Nitro Tasks Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Tasks:** ${{ steps.tasks.outputs.tasks }}" >> $GITHUB_STEP_SUMMARY
