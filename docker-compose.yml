services:
  webapp:
    build: .
    working_dir: /home/node/app
    ports:
      - "3000:3000"
      # prisma studio
      - "5555:5555"
    volumes:
      # @TODO fix permission issues for pnpm-store volume 
      # - pnpm-store:/home/node/app/.pnpm-store
      - .:/home/node/app
    tty: true
    depends_on:
      - database
    networks:
      - virify-network
    user: node

  database:
    image: postgis/postgis:17-3.4
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - virify-network

volumes:
  pgdata:
  # pnpm-store:

networks:
  virify-network:
